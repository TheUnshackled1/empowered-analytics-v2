{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/panel1_login.css' %}">
{% endblock %}

{% block content %}
<div class="panel-card login-card">
  <div class="panel-head login-panel-head">
    <span class="panel-title">Secure OAuth Login Screen</span>
  </div>
  <div class="login-brand-hero">
    <div class="tip-seal tip-seal-lg">T.I.P.</div>
    <div class="login-brand-title">EmpowerED</div>
    <div class="login-brand-sub">INSTITUTIONAL SINGLE SIGN-ON</div>
  </div>

  <div class="login-fields-group">
    <label class="input-lbl login-input-lbl" for="sso-email-input">Institutional Username</label>
    <input class="input-box" id="sso-email-input" type="email" value="{{ sso_email }}" autocomplete="username" required>
    <label class="input-lbl login-input-lbl" for="sso-password-input">Password</label>
    <div class="password-field-wrap">
      <input class="input-box password-input" id="sso-password-input" type="password" value="TIP@EmpowerED2026" autocomplete="current-password" required>
      <button type="button" class="password-toggle-btn" id="sso-password-toggle" onclick="togglePasswordVisibility()" aria-label="Show password" title="Show password">
        <svg id="eye-icon-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
        <svg id="eye-icon-closed" class="is-hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
          <line x1="1" y1="1" x2="23" y2="23"></line>
        </svg>
      </button>
    </div>
  </div>

  <button class="btn-gold btn-sso-login" id="btn-sso-submit" data-redirect-url="{% url 'panel2-dashboard' %}" onclick="handleInstitutionalLogin(this)">
    ⊞ Log in with T.I.P. Microsoft Account
  </button>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'javascript/panel1_login.js' %}"></script>
{% endblock %}
